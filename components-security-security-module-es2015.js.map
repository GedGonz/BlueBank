module.exports = "<div class=\"row\">\n    <div class=\"col-md-1\"></div>\n    <div class=\"col-md-4\">\n        <div class=\"padding-top\">\n            <form [formGroup]=\"loginForm\">\n\n\n                <div class=\"titulologin text-center\">\n                    <h3 class=\"text-center title\">Blue <span class=\"spaner\">Bank</span></h3>\n                    <div class=\"borde\"></div><br>\n                    <br></div>\n                <div class=\"form-group\">\n                    <input name=\"user\" type=\"text\" placeholder=\"Username\" class=\"form-control\" formControlName=\"user\"><br>\n                    <input name=\"pasword\" type=\"password\" placeholder=\"Password\" class=\"form-control\" formControlName=\"password\">\n                </div>\n                <div *ngIf=\"loginForm.controls['user'].invalid && (loginForm.controls['user'].dirty || loginForm.controls['user'].touched)\" class=\"alert alert-danger\">\n                    <div *ngIf=\"loginForm.controls['user'].errors.required\">\n                        User is required.\n                    </div>\n                </div>\n                <div *ngIf=\"loginForm.controls['password'].invalid && (loginForm.controls['password'].dirty || loginForm.controls['password'].touched)\" class=\"alert alert-danger\">\n                    <div *ngIf=\"loginForm.controls['password'].errors.required\">\n                        Password is required.\n                    </div>\n                </div>\n                <br>\n                <br>\n                <div class=\"form-group\">\n                    <button [disabled]=\"loginForm.pristine || loginForm.invalid\" class=\"btn btn-primary btn-lg  btn-block btn-group-justified\" (click)=\"login()\">\n                         Login \n                    </button>\n                    <br>\n                </div>\n                <br>\n                <p class=\"slogan\">simple, safe <span>and easy</span> </p>\n            </form>\n        </div>\n    </div>\n    <div class=\"col-md-7 text-center\">\n\n        <img src=\"/src/assets/image/baner.png\" alt=\"baner\" style=\"width: 80%;\">\n    </div>\n\n\n\n\n    <ngx-loading [show]=\"loading\" [config]=\"{ backdropBorderRadius: '3px' }\"></ngx-loading>\n</div>"
